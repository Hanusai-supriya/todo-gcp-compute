
# CI/CD: Test, build, and deploy Todo app
name: Todo App CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEPLOY_USER: ubuntu
  DEPLOY_HOST: 13.233.159.136

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test -- --run

      - name: Type check
        run: npm run test:typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote staging directory
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /tmp/todoapp'

      - name: Copy build files to server
        run: |
          scp -r dist/. \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/todoapp/"

      - name: Publish build
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo mkdir -p /var/www/html &&
             sudo cp -a /tmp/todoapp/. /var/www/html/ &&
             rm -rf /tmp/todoapp'

      - name: Smoke test deployed application
        run: |
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 3 \
            --retry-connrefused \
            http://13.233.159.136/
