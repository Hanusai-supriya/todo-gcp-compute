# Deploy to Remote server using SSH key form Actions Secrets
name: Deploy to Remote Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEPLOY_USER: rhythmsuriya
  DEPLOY_HOST: 35.200.196.48

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build todo app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote staging directory
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /tmp/todoapp'

      - name: Copy build files to server
        run: scp -r dist/. "$DEPLOY_USER@$DEPLOY_HOST:/tmp/todoapp/"

      - name: Publish build
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo mv /tmp/todoapp/* /var/www/html/ && rm -rf /tmp/todoapp'
