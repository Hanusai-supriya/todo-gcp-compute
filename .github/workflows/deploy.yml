
name: Todo App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
         
      - name: Install dependencies
        run: npm ci
  
      - name: Run lint checks
        run: npm run lint

      - name: Check TypeScript types
        run: npm run test:typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  cd:
    needs: ci
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-app-build-${{ github.sha }}
          path: dist

      - name: Connect to AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload build to S3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          BUILD_PREFIX: builds/${{ github.sha }}
        run: aws s3 sync dist/ "s3://${DEPLOY_BUCKET}/${BUILD_PREFIX}/" --no-progress

      - name: Deploy build to EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          BUILD_PREFIX: builds/${{ github.sha }}
          DEPLOY_DIRECTORY: /var/www/html
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::DEPLOY_BUCKET must be a valid S3 bucket name."
            exit 1
          fi

          deploy_command="aws s3 sync 's3://${DEPLOY_BUCKET}/${BUILD_PREFIX}/' '${DEPLOY_DIRECTORY}/' --delete"
          parameters=$(jq -n --arg command "$deploy_command" '{commands: [$command]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command ID: $command_id"

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status, StatusDetails:StatusDetails, StandardOutputContent:StandardOutputContent, StandardErrorContent:StandardErrorContent}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text
